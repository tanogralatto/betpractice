# Actualiza los datos y publica la página en GitHub Pages.
#
# - Botón manual: pestaña "Actions" → "Actualizar datos y publicar" → "Run workflow".
#   Baja de API-Football las ligas elegidas (histórico de la temporada actual y la
#   anterior, partidos y cuotas de los próximos días) y vuelve a publicar la página.
# - Cada cambio de código en main vuelve a publicar la página con los últimos datos
#   guardados (sin gastar pedidos a la API).
# - Sin el secreto API_FOOTBALL_KEY se publican datos de prueba.
# La base sincronizada se guarda en la rama "datos" para que la próxima vez solo baje lo nuevo.
name: Actualizar datos y publicar

on:
  workflow_dispatch:
    inputs:
      ligas:
        description: "Ligas (ids de API-Football separados por coma). 128 = Argentina, 39 = Premier League"
        default: "128,39"
        required: true
      dias:
        description: "Cuántos días de partidos y cuotas bajar desde hoy"
        default: "2"
        required: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      LIGAS: ${{ inputs.ligas || '128,39' }}
      DIAS: ${{ inputs.dias || '2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Recuperar la base guardada
        run: |
          if git fetch -q origin datos 2>/dev/null; then
            git show origin/datos:betpractice_api_football.db > backend/betpractice_api_football.db
            echo "Base recuperada."
          else
            echo "Todavía no hay base guardada (primera vez)."
          fi

      - name: Bajar datos
        working-directory: backend
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::warning::No está el secreto API_FOOTBALL_KEY: se publican datos de prueba."
            export DATA_PROVIDER=seed
            python -m app.seed
          else
            export DATA_PROVIDER=api_football
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              ARGS=""
              for id in $(echo "$LIGAS" | tr ',' ' '); do ARGS="$ARGS --league $id"; done
              python -m app.sync history $ARGS --season current --season previous
              python -m app.sync daily --days "$DIAS"
            fi
            if [ ! -f betpractice_api_football.db ]; then
              echo "::warning::Todavía no se bajaron datos reales: corré 'Actualizar datos' a mano. Se publican datos de prueba."
              export DATA_PROVIDER=seed
              python -m app.seed
            fi
          fi
          python -m app.export_static

      - name: Guardar la base para la próxima vez
        if: github.event_name == 'workflow_dispatch' && env.API_FOOTBALL_KEY != ''
        run: |
          mkdir -p /tmp/datos && cp backend/betpractice_api_football.db /tmp/datos/
          cd /tmp/datos
          git init -q -b datos
          git add betpractice_api_football.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Base sincronizada $(date '+%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Armar la página
        working-directory: frontend
        env:
          VITE_UPDATE_URL: https://github.com/${{ github.repository }}/actions/workflows/actualizar-datos.yml
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
