# Publica la página en GitHub Pages cada vez que hay cambios en main.
# No usa la clave de API-Football: la página le pide los datos a la API directamente,
# con la clave que cargás en ⚙ Ajustes (queda guardada en tu navegador).
# Incluye datos de prueba (seed) para ver la app sin clave.
name: Publicar la página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  armar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Datos de prueba
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.seed
          python -m app.export_static

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Armar la página
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
